<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mission Control AI</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <span class="eyebrow">PERSONAL LEARNING OS</span>
      <h1>Mission Control AI</h1>
    </div>
    <span id="system-status" class="status-dot">本地就绪</span>
  </header>

  <main class="shell">
    <aside class="sidebar">
      <button class="nav active" data-view="today">今日任务</button>
      <button class="nav" data-view="plan">四周计划</button>
      <button class="nav" data-view="review">每周复盘</button>
      <button class="nav" data-view="runs">AI 运行记录</button>
      <div class="side-section">
        <label for="goal-select">当前目标</label>
        <select id="goal-select"></select>
        <button id="new-goal" class="secondary">＋ 创建目标</button>
      </div>
    </aside>

    <section class="content">
      <div id="empty-state" class="hero panel">
        <span class="eyebrow">START HERE</span>
        <h2>把目标变成可验证的四周行动</h2>
        <p>计划中的每个任务都有产出和验收标准。提交学习证据后，系统会判断是否真正掌握。</p>
        <button id="hero-create">创建第一个学习目标</button>
      </div>

      <div id="today-view" class="view hidden">
        <div class="page-heading">
          <div><span class="eyebrow">TODAY</span><h2 id="today-title">今日任务</h2></div>
          <span id="plan-version" class="pill"></span>
        </div>
        <div id="today-stats" class="stats"></div>
        <div id="today-tasks" class="task-list"></div>
      </div>

      <div id="plan-view" class="view hidden">
        <div class="page-heading">
          <div><span class="eyebrow">ROADMAP</span><h2>四周计划</h2></div>
          <button id="regenerate-plan" class="secondary">重新生成</button>
        </div>
        <div id="plan-rationale" class="notice"></div>
        <div id="weeks" class="weeks"></div>
      </div>

      <div id="review-view" class="view hidden">
        <div class="page-heading"><div><span class="eyebrow">REFLECT</span><h2>每周复盘</h2></div></div>
        <div class="panel review-panel">
          <label for="review-week">复盘周次</label>
          <select id="review-week"><option value="1">第 1 周</option><option value="2">第 2 周</option><option value="3">第 3 周</option><option value="4">第 4 周</option></select>
          <button id="create-review">生成复盘建议</button>
        </div>
        <div id="review-result"></div>
      </div>

      <div id="runs-view" class="view hidden">
        <div class="page-heading"><div><span class="eyebrow">OBSERVABILITY</span><h2>AI 运行记录</h2></div></div>
        <div class="table-wrap"><table><thead><tr><th>类型</th><th>状态</th><th>模型</th><th>Prompt</th><th>耗时</th><th>时间</th></tr></thead><tbody id="runs-table"></tbody></table></div>
      </div>
    </section>
  </main>

  <dialog id="goal-dialog">
    <form id="goal-form" method="dialog">
      <div class="dialog-heading"><div><span class="eyebrow">NEW MISSION</span><h2>创建学习目标</h2></div><button type="button" class="icon" data-close>×</button></div>
      <label>目标名称<input name="title" required minlength="2" placeholder="例如：掌握 LangGraph 工程实践"></label>
      <label>当前水平<textarea name="current_level" required placeholder="我已经会 Python 和基础 LLM API"></textarea></label>
      <label>期望产出<textarea name="desired_outcome" required placeholder="四周后能够独立完成什么？"></textarea></label>
      <div class="form-row">
        <label>截止日期<input name="deadline" type="date" required></label>
        <label>每周小时<input name="weekly_hours" type="number" min="1" max="80" value="6" required></label>
      </div>
      <label>学习偏好<input name="learning_preferences" placeholder="官方文档、动手项目"></label>
      <button type="submit">创建并生成计划</button>
      <p class="form-hint">无 API Key 时使用本地降级计划，完整流程仍然可运行。</p>
    </form>
  </dialog>

  <dialog id="submit-dialog">
    <form id="submit-form" method="dialog">
      <div class="dialog-heading"><div><span class="eyebrow">EVIDENCE</span><h2 id="submit-title">提交学习证据</h2></div><button type="button" class="icon" data-close>×</button></div>
      <input type="hidden" name="task_id">
      <label>完成说明与验证结果<textarea name="evidence_text" required minlength="10" rows="7" placeholder="说明做了什么、怎么验证、测试结果是什么"></textarea></label>
      <label>GitHub / Commit 链接（可选）<input name="repository_url" type="url" placeholder="https://github.com/..."></label>
      <label>实际耗时（分钟）<input name="actual_minutes" type="number" min="1" max="1440" value="60" required></label>
      <button type="submit">提交并评估</button>
    </form>
  </dialog>

  <div id="toast" class="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
