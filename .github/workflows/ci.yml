name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Check and test frontend
        run: npm --prefix frontend run check && npm --prefix frontend test
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Verify frontend build output
        run: test -f app/static/index.html && test -n "$(find app/static/assets -type f -name 'index-*.js' -print -quit)" && test -n "$(find app/static/assets -type f -name 'index-*.css' -print -quit)"
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Offline AI quality gate
        run: python -m evals.run --suite all --split regression
      - name: Compile check
        run: python -m compileall -q app evals tests
      - name: Validate database migration
        run: DATABASE_URL=sqlite:////tmp/mission-control-migration.db python -m alembic upgrade head
