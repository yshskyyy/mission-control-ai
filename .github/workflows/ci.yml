name: CI

on:
  push:
  pull_request:

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Offline AI quality gate
        run: python -m evals.run --suite all
      - name: Compile check
        run: python -m compileall -q app evals tests
      - name: Validate database migration
        run: DATABASE_URL=sqlite:////tmp/mission-control-migration.db python -m alembic upgrade head
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Type-check and build frontend
        run: npm --prefix frontend run check && npm --prefix frontend run build
